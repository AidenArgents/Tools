<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>全球市场气候与时间</title>
  <style>
    :root {
      --shell-bg: #07161b;
      --shell-line: rgba(148, 184, 190, .18);
      --shell-text: #eef6f3;
      --shell-muted: #91a9ad;
      --shell-accent: #f4c45c;
      --shell-accent-text: #172329;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--shell-bg); }
    body { font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--shell-text); }
    .app-shell { display: grid; grid-template-rows: 58px minmax(0, 1fr); width: 100%; height: 100%; }
    .page-bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      padding: 0;
      border-bottom: 1px solid var(--shell-line);
      background: rgba(7, 22, 27, .96);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
    }
    .page-tabs { display: flex; align-items: center; gap: 8px; width: min(1880px, 100%); margin: 0 auto; padding: 0 clamp(18px, 2vw, 32px); }
    .page-tab {
      appearance: none;
      border: 1px solid var(--shell-line);
      border-radius: 999px;
      padding: 9px 18px;
      background: rgba(255, 255, 255, .025);
      color: var(--shell-muted);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .page-tab:hover { color: var(--shell-text); border-color: rgba(244, 196, 92, .48); }
    .page-tab:focus-visible { outline: 2px solid #72dbc9; outline-offset: 2px; }
    .page-tab[aria-selected="true"] { color: var(--shell-accent-text); background: var(--shell-accent); border-color: var(--shell-accent); box-shadow: 0 5px 18px rgba(244, 196, 92, .2); }
    .page-stage { position: relative; min-height: 0; background: #061419; }
    .page-frame { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #061419; }
    .page-frame[hidden] { display: none; }
    @media (max-width: 680px) {
      .app-shell { grid-template-rows: 54px minmax(0, 1fr); }
      .page-bar { padding: 0; }
      .page-tabs { gap: 5px; }
      .page-tab { padding: 8px 11px; font-size: 13px; }
    }
    @media (max-width: 390px) {
      .page-tabs { padding-right: 12px; padding-left: 12px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="page-bar">
      <nav class="page-tabs" role="tablist" aria-label="页面切换">
        <button class="page-tab" id="tab-time" type="button" role="tab" aria-selected="true" aria-controls="page-time" data-page="time">全球时间</button>
        <button class="page-tab" id="tab-climate" type="button" role="tab" aria-selected="false" aria-controls="page-climate" data-page="climate">气候与备货</button>
        <button class="page-tab" id="tab-profile" type="button" role="tab" aria-selected="false" aria-controls="page-profile" data-page="profile">人口与收入</button>
      </nav>
    </header>
    <section class="page-stage">
      <iframe class="page-frame" id="page-time" title="全球时间换算" aria-labelledby="tab-time"></iframe>
      <iframe class="page-frame" id="page-climate" title="全球市场气候与备货" aria-labelledby="tab-climate" hidden></iframe>
      <iframe class="page-frame" id="page-profile" title="全球人口与收入画像" aria-labelledby="tab-profile" hidden></iframe>
    </section>
  </main>

      const tabs = Array.from(document.querySelectorAll(".page-tab"));
      const frames = {
        climate: document.getElementById("page-climate"),
        profile: document.getElementById("page-profile"),
        time: document.getElementById("page-time")
      };
      const loaded = new Set();

      function decodePage(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return new TextDecoder("utf-8").decode(bytes);
      }

      async function decodeGzipPage(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return await new Response(stream).text();
      }

      async function ensureLoaded(page) {
        if (loaded.has(page)) return;
        loaded.add(page);
        if (page === "profile") frames[page].srcdoc = await decodeGzipPage(PROFILE_PAGE_GZIP);
        else frames[page].srcdoc = decodePage(encodedPages[page]);
      }

      function activate(page, focusTab = false) {
        if (!frames[page]) page = "time";
        ensureLoaded(page);
        Object.entries(frames).forEach(([name, frame]) => { frame.hidden = name !== page; });
        tabs.forEach(tab => {
          const active = tab.dataset.page === page;
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
          if (active && focusTab) tab.focus();
        });
        document.title = page === "time" ? "全球时间 · 全球市场工具" : page === "climate" ? "气候与备货 · 全球市场工具" : "人口与收入 · 全球市场工具";
        try { localStorage.setItem(PAGE_STORAGE_KEY, page); } catch (_) {}
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => activate(tab.dataset.page));
        tab.addEventListener("keydown", event => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          event.preventDefault();
          const step = event.key === "ArrowRight" ? 1 : -1;
          const next = tabs[(index + step + tabs.length) % tabs.length];
          activate(next.dataset.page, true);
        });
      });

      let initialPage = "time";
      try { initialPage = localStorage.getItem(PAGE_STORAGE_KEY) || initialPage; } catch (_) {}
      activate(initialPage);
      Object.keys(frames).forEach(ensureLoaded);
    })();
